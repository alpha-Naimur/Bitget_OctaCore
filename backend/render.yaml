services:
  - type: web
    name: bitget-octacore-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: EXECUTION_MODE
        value: SUB_ACCOUNT
      - key: BITGET_OAUTH_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
